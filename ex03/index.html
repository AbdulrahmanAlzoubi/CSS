<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="color named">
        Named Color
    </div>

    <div class="color hex">
        HEX Color
    </div>

    <div class="color rgb">
        RGB Color
    </div>

    <div class="color rgba">
        RGBA Color
    </div>

    <div class="comparison">

        <div class="opacity-box">
            <p>Opacity: 0.5</p>
        </div>

        <div class="rgba-box">
            <p>RGBA: 0.5</p>
        </div>

    </div>

</body>
</html>
